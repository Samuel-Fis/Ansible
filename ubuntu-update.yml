---
# Usage: ansible-playbook -i terraform_inventory.ini Updating-Ubuntu.yml
 
- name: Update and upgrade Ubuntu servers
  hosts: all
  become: true
 
  tasks:
    - name: Report hosts that are not Ubuntu
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }} is {{ ansible_facts['distribution'] }}, skipping"
      when: ansible_facts["distribution"] != "Ubuntu"
 
    - name: End play for non-Ubuntu hosts
      ansible.builtin.meta: end_host
      when: ansible_facts["distribution"] != "Ubuntu"
 
    - name: Update apt cache and upgrade all packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        autoremove: true
 
    - name: Check if a reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required
 
    - name: Reboot if required
      ansible.builtin.reboot:
      when: reboot_required.stat.exists
 
    - name: Get Ubuntu version
      ansible.builtin.command: lsb_release -ds
      register: ubuntu_version
      changed_when: false
 
    - name: Show Ubuntu version
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: {{ ubuntu_version.stdout }}"
 
